<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — IMEMA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1d20; --muted:#62626a; --blue:#004dff; --line:#e4e4e7; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #fcfcfc; color: var(--ink); font-family: Inter, system-ui, sans-serif; padding: 24px; }
  .box { max-width: 560px; width: 100%; border: 1px solid var(--line); padding: 40px; background: #fff; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: "Instrument Sans", sans-serif; text-transform: uppercase; letter-spacing: -.025em; font-weight: 600; font-size: 40px; line-height: 1; margin: 18px 0 14px; }
  p { color: var(--muted); line-height: 1.6; }
  a.btn { display: inline-block; margin-top: 28px; background: var(--blue); color: #fff; text-decoration: none; padding: 14px 20px; }
  a.btn:hover { opacity: .9; }
</style>
</head>
<body>
  <div class="box">
    <span class="mono">404 / IMEMA</span>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved. IMEMA's website has been renewed; everything you need is on the home page.</p>
    <a class="btn mono" style="color:#fff" href="/">Go to imema.gr →</a>
  </div>
</body>
</html>
