name: Fetch media into the repository
on:
  push:
    paths: ["media/manifest.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every file listed in media/manifest.txt
        run: |
          set -e
          while read -r path url; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$path" "$url"
            echo "$(du -h "$path" | cut -f1)  $path"
          done < media/manifest.txt
      - name: Commit the files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add media
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Add media files fetched from manifest"
          git push
