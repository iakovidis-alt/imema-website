name: Build site CSS
on:
  push:
    paths: ["*.html", "assets/*.js", "tailwind.config.js", "src/tailwind.css"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-css
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build assets/tailwind.css with the Tailwind standalone CLI
        run: |
          curl -fsSL -o tw https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tw
          ./tw -c tailwind.config.js -i src/tailwind.css -o assets/tailwind.css --minify
          ls -l assets/tailwind.css
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/tailwind.css
          git diff --cached --quiet && echo "CSS unchanged" && exit 0
          git commit -m "Rebuild site CSS"
          git push
